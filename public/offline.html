<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141311">
  <title>Afterhours — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); background: #141311; color: #e9e4d8; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    main { max-width: 340px; }
    .mark { display: inline-grid; width: 48px; height: 48px; place-items: center; border: 1px solid #a33a32; color: #c55448; font-size: 22px; }
    h1 { margin: 24px 0 8px; font: 400 40px/1 Georgia, serif; letter-spacing: -.04em; }
    p { color: #989287; }
    button { min-height: 48px; margin-top: 14px; padding: 0 20px; border: 1px solid #a33a32; background: #a33a32; color: #fff8ee; font: inherit; }
  </style>
</head>
<body><main><span class="mark" aria-hidden="true">◉</span><h1>You're offline.</h1><p>Your private rolls and photos need a connection. Reconnect to open them again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
